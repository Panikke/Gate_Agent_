<title>Morning Wave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: scoreboard strip on top; departures board (dark split-flap panel) beside the flight editor and apron timeline; stacks on phones. */
:root{--bg:#e8ecef;--surface:#f8fafb;--ink:#14212b;--muted:#566673;--line:#c7d0d7;--accent:#f2b705;--accent-ink:#14212b;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161d;--surface:#16212a;--ink:#e5ecf1;--muted:#93a3af;--line:#2b3a46;--accent:#f2b705;--accent-ink:#14212b;
--ok:#45c48b;--bad:#f2695e;--warn:#f0a53a;--board:#080d12;--board-ink:#f6d868;--board-dim:#7d8892;--board-line:#1f2c36;
--blk-ok:#1d4d39;--blk-ok-ink:#c9f2de;--blk-bad:#5e2420;--blk-bad-ink:#ffd9d5;--shut:#222e38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e161d;--surface:#16212a;--ink:#e5ecf1;--muted:#93a3af;--line:#2b3a46;--accent:#f2b705;--accent-ink:#14212b;
--ok:#45c48b;--bad:#f2695e;--warn:#f0a53a;--board:#080d12;--board-ink:#f6d868;--board-dim:#7d8892;--board-line:#1f2c36;
--blk-ok:#1d4d39;--blk-ok-ink:#c9f2de;--blk-bad:#5e2420;--blk-bad-ink:#ffd9d5;--shut:#222e38;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);margin:0;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h1{font-size:34px;line-height:1}h2{font-size:18px;color:var(--muted)}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 12px;min-height:36px}
button:hover:not(:disabled){border-color:var(--ink)}button:disabled{opacity:.4;cursor:not-allowed}
button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-height:36px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between}
.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}

.score{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);background:var(--surface);border-radius:4px}
.score div{padding:8px 12px;border-left:1px solid var(--line);min-width:0}.score div:first-child{border-left:0}

.board .row:hover{background:var(--board-line)}
.board .row.sel{background:var(--accent);color:var(--accent-ink)}
.board .row.sel .st,.board .row.sel .dim{color:var(--accent-ink)}

.tl-scroll{overflow-x:auto}

.tl .blk.bad{background:var(--blk-bad);color:var(--blk-bad-ink)}
.tl .blk.sel{outline:2px solid var(--accent);outline-offset:0;z-index:2}
.tl .axis{position:relative;height:18px;color:var(--muted)}.tl .axis i{position:absolute;font-style:normal;transform:translateX(-50%)}
.tl .grp{font:600 12px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 0 2px}
.tl svg{display:block;width:100%;height:64px;border-top:1px solid var(--line)}
.cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;z-index:3}
.result{border-color:var(--accent);border-width:2px}
.alert{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--board);color:var(--board-ink);border-radius:4px;padding:10px 14px;font-size:14px}
.alert b{font-family:var(--data);margin-right:6px}
.alert.hot{background:var(--accent);color:var(--accent-ink)}
.alert .a-t{flex:1 1 380px;min-width:0}.alert .a-c{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert button{background:transparent;color:inherit;border-color:currentColor}
.alert.hot button.go{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.secs{font:700 18px var(--data);min-width:3em;text-align:right}
.bar{width:120px;height:6px;background:rgba(0,0,0,.18);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent-ink)}
.lock{font-size:14px;color:var(--warn);font-weight:500}
.log{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.log b{font-family:var(--data);color:var(--muted);margin-right:4px}.log li.ev{color:var(--warn)}.log li.bad{color:var(--bad)}.log li.warn{color:var(--bad);font-style:italic}
.dl{margin:4px 0 0;padding-left:18px}
.tl .blk{touch-action:none;cursor:grab}.tl .blk.dragging{cursor:grabbing;z-index:5;opacity:.9;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tl .blk.locked{outline:1px dashed var(--muted);outline-offset:-1px}.tl .blk.gone{opacity:.45}
.tl .trk.svc.over{background-color:color-mix(in srgb,var(--bad) 12%,transparent)}
.tl .trk.target{background-color:color-mix(in srgb,var(--accent) 18%,transparent)}
.tl .shut.hatch{background:repeating-linear-gradient(135deg,var(--shut) 0 6px,var(--bad) 6px 8px);opacity:.55}
.result .big{font:700 28px var(--data)}
.result textarea{width:100%;font:13px var(--data);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;resize:none}
details{font-size:14px}summary{cursor:pointer;font-weight:600}details ul{margin:8px 0 0;padding-left:18px;max-width:70ch}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){h1{font-size:28px}.score{grid-template-columns:repeat(3,1fr)}.score div:nth-child(4){border-left:0}.score div:nth-child(n+4){border-top:1px solid var(--line)}
.board .hd,.board .row{grid-template-columns:3.4em 4.2em minmax(0,1fr) 1.9em 1.9em 5.6em;font-size:12px}.board .cls{display:none}.fld{grid-template-columns:minmax(0,1fr)}}
</style>
<div class="wrap">
  <div class="top">
    <div><h1>Morning Wave</h1><p>Get every departure off the apron. Give each flight a stand, a gate and check-in desks, then start the shift and handle what goes wrong. Each shift you clear unlocks a harder one.</p></div>
    <div class="ctl">
      <label for="scn" style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Shift</label>
      <select id="scn"></select>
      <button id="undo" disabled title="Undo (Ctrl+Z)">Undo</button><button id="reroll" hidden>New wave</button><button id="clear">Clear plan</button><button id="house">Show house plan</button><button id="run" class="go">Start the shift</button>
    </div>
  </div>
  <div class="score" id="score"></div>
  <div class="note" id="note" hidden></div>
  <div class="alert" id="alert" hidden></div>
  <div id="result"></div>
  <div class="main">
    <div class="col"><div class="board" id="board"></div><div class="panel" id="logp" hidden><h2>Shift log</h2><ul class="log" id="log"></ul></div></div>
    <div class="col">
      <div class="panel" id="editor"></div>
      <div class="panel"><h2>Apron and gates</h2><div class="tl-scroll"><div class="tl" id="tl"></div></div></div>
      <div class="panel"><details id="how"><summary>Rules and scoring</summary><ul id="rules"></ul></details></div>
    </div>
  </div>
</div>
<script>
// Morning Wave core rules. Pure functions, no DOM. Shared by the game and the tests.
const CLS = { S: 0, M: 1, L: 2 };
const t = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const RULES = { standBefore: 50, gateBefore: 35, after: 10, closeBefore: 10, maxDelay: 60, maxDesks: 6,
  ptsNormal: 100, ptsHigh: 150, grace: 15, delayNormal: 1, delayHigh: 2, failPenalty: 200, deskBonus: 10 };

const TRAINING = {
  id: 'training', name: 'Training day', level: 0, teams: 0, desks: 12, rate: 4,
  stands: [['S1','S','07:00'],['S2','M','07:00'],['S3','M','07:00'],['S4','L','07:00'],['S5','L','07:30'],['S6','L','08:00']]
    .map(([id, cls, f]) => ({ id, cls, from: t(f), to: t('11:30') })),
  gates: [['A1','S','07:00'],['A2','M','07:00'],['A3','M','07:00'],['B1','L','07:00'],['B2','L','07:30']]
    .map(([id, cls, f]) => ({ id, cls, from: t(f), to: t('11:30') })),
  flights: [
    ['AL220','Madrid','07:35',152,'M',15,1],['BR237','Paris CDG','07:49',109,'S',20,0],['CJ254','Rome FCO','07:56',130,'M',18,0],
    ['DX271','Paris CDG','08:07',163,'M',15,0],['EZ288','Rome FCO','08:17',85,'S',18,0],['AL305','Paris CDG','08:26',170,'M',12,0],
    ['BR322','Berlin','08:38',114,'S',15,0],['CJ339','Paris CDG','08:49',186,'M',15,1],['DX356','Rome FCO','08:56',178,'M',12,0],
    ['EZ373','Lisbon','09:09',285,'L',15,0],['AL390','Copenhagen','09:19',167,'M',20,0],['BR407','Paris CDG','09:26',126,'M',20,0],
    ['CJ424','Rome FCO','09:38',162,'M',18,0],['DX441','Dublin','09:45',187,'M',20,0],['EZ458','Berlin','09:55',264,'L',15,1],
    ['AL475','Amsterdam','10:08',173,'M',12,0],['BR492','Dublin','10:17',169,'M',20,0],['CJ509','Rome FCO','10:25',174,'M',20,0]
  ].map(([id, dest, dep, pax, cls, svc, hi]) => ({ id, dest, dep: t(dep), pax, cls, svc, high: !!hi, open: t(dep) - 60 }))
};

function rng(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  let a = h >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
}

// Shift ladder: each level adds a complication and keeps the earlier ones. A roll gives a different wave at the same level.
const TWISTS = ['', 'a plain wave', 'short on check-in desks', 'ground service teams', 'a closure mid-wave', 'late inbound aircraft'];
const twist = n => n <= 5 ? TWISTS[n] : 'everything at once, tighter each shift';
function shift(n, roll) {
  const r = rng('shift-' + n + '-' + (roll || 0)), ri = (a, b) => a + Math.floor(r() * (b - a + 1)), pick = a => a[Math.floor(r() * a.length)];
  const sc = JSON.parse(JSON.stringify(TRAINING)), x = Math.max(0, n - 5);
  sc.id = 'shift-' + n + '-' + (roll || 0); sc.name = 'Shift ' + n; sc.level = n; sc.notes = [];
  sc.desks = n >= 2 ? Math.max(7, 8 - Math.floor(x / 2)) : 10;
  sc.teams = n >= 3 ? 3 : 0;
  const facs = [...sc.stands.slice(1), ...sc.gates.slice(1)];
  const late = pick(facs.slice(0, 3).concat(facs.slice(5, 7)));
  late.from = t('07:00') + ri(4, 9) * 10; sc.notes.push(late.id + ' out of use until ' + hhmm(late.from) + '.');
  sc.notes.push(sc.desks + ' check-in desks staffed.');
  if (sc.teams) sc.notes.push('Only ' + sc.teams + ' ground teams (fuel, catering, cleaning, bags). Every flight needs one for its last 12 to 20 minutes before departure, so no more than ' + sc.teams + ' flights can be in that final stretch at once. See the Team lanes on the timeline.');
  for (let i = 0, used = [late.id]; i < (n >= 4 ? (x >= 3 ? 2 : 1) : 0); i++) {
    let f; do f = pick(facs); while (used.includes(f.id)); used.push(f.id);
    const a = t('08:10') + ri(0, 9) * 10; f.shuts = [[a, a + ri(4, 6) * 10, -1e9]];
    sc.notes.push(f.id + ' closed ' + hhmm(f.shuts[0][0]) + ' to ' + hhmm(f.shuts[0][1]) + '.');
  }
  const air = ['AL','BR','CJ','DX','EZ','FN','GK'], dest = ['Madrid','Paris CDG','Rome FCO','Berlin','Lisbon','Dublin','Amsterdam','Copenhagen','Vienna','Athens','Oslo','Zurich'];
  const count = 15 + Math.min(x, 4) + ri(0, 1); let dep = t('07:52') + ri(0, 8), num = ri(200, 260); sc.flights = [];
  for (let i = 0; i < count; i++) {
    const v = r(), cls = v < 0.2 ? 'S' : v < 0.78 ? 'M' : 'L';
    const pax = cls === 'S' ? ri(80, 120) : cls === 'M' ? ri(125, 190) : ri(240, 300);
    sc.flights.push({ id: pick(air) + num, dest: pick(dest), dep, pax, cls, svc: pick([12, 15, 18, 20]), high: r() < 0.2, open: dep - 60 });
    dep += x >= 2 ? ri(7, 13) : ri(8, 14); num += ri(11, 19);
  }
  if (n >= 5) for (let i = 0, done = []; i < 2 + Math.min(x, 2); i++) {
    let f; do f = sc.flights[ri(1, count - 1)]; while (done.includes(f.id)); done.push(f.id);
    f.dep += ri(10, 25); f.late = true; sc.notes.push(f.id + ' aircraft arrived late, now departs ' + hhmm(f.dep) + '.');
  }
  sc.flights.sort((p, q) => p.dep - q.dep);
  sc.events = makeEvents(sc, n <= 1 ? 1 : n <= 3 ? 2 : n <= 5 ? 3 : 3 + Math.min(x, 2), rng('events-' + sc.id));
  return sc;
}

// Live disruptions, announced during the run. Every event is chosen so that it only touches what a planner
// can still change at the moment it is announced: a late aircraft is announced before its stand time, a surge
// before check-in opens, and a closure spares any flight already on that stand or gate when it is announced.
function makeEvents(sc, n, r) {
  const ri = (a, b) => a + Math.floor(r() * (b - a + 1)), pick = a => a[Math.floor(r() * a.length)], ev = [], used = new Set();
  const far = at => at >= t('07:10') && at <= t('10:40') && ev.every(e => Math.abs(e.at - at) >= 10);
  for (let tries = 0; ev.length < n && tries < 200; tries++) {
    const kind = pick(['late', 'late', 'closure', 'closure', 'surge']);
    if (kind === 'late') {
      const f = pick(sc.flights); if (used.has(f.id)) continue;
      const at = f.dep - RULES.standBefore - ri(12, 30); if (!far(at)) continue;
      used.add(f.id); ev.push({ at, kind, flight: f.id, mins: ri(15, 35) });
    } else if (kind === 'surge') {
      const f = pick(sc.flights); if (used.has(f.id)) continue;
      const at = f.open - ri(8, 20); if (!far(at)) continue;
      used.add(f.id); ev.push({ at, kind, flight: f.id, extra: Math.round(f.pax * ri(25, 45) / 100) });
    } else {
      const fac = pick([...sc.stands, ...sc.gates]), at = t('07:20') + ri(0, 18) * 10; if (!far(at) || used.has(fac.id)) continue;
      const from = at + ri(15, 30); used.add(fac.id);
      ev.push({ at, kind, fac: fac.id, from, to: from + ri(3, 6) * 10 });
    }
  }
  return ev.sort((a, b) => a.at - b.at);
}
TRAINING.events = makeEvents(TRAINING, 2, rng('events-training'));

function describe(e, sc) {
  const f = e.flight && sc.flights.find(x => x.id === e.flight);
  if (e.kind === 'late') return `${e.flight}'s inbound aircraft is running ${e.mins} min late. It now departs ${hhmm(f.dep + e.mins)} at the earliest.`;
  if (e.kind === 'surge') return `${e.flight} has ${e.extra} extra passengers from a cancelled flight elsewhere: ${f.pax + e.extra} to check in.`;
  return `${e.fac[0] === 'S' ? 'Stand' : 'Gate'} ${e.fac} is unserviceable from ${hhmm(e.from)} to ${hhmm(e.to)}. Flights whose aircraft are already on stand are not affected.`;
}

// The scenario as known at minute `upto` (-Infinity = before the shift, Infinity = everything).
function scenarioAt(sc, upto) {
  const s = JSON.parse(JSON.stringify(sc));
  for (const e of sc.events || []) if (e.at <= upto) {
    if (e.kind === 'late') { const f = s.flights.find(x => x.id === e.flight); f.dep += e.mins; f.late = true; }
    else if (e.kind === 'surge') s.flights.find(x => x.id === e.flight).pax += e.extra;
    else { const fac = [...s.stands, ...s.gates].find(x => x.id === e.fac); (fac.shuts = fac.shuts || []).push([e.from, e.to, e.at]); }
  }
  return s;
}
// A closure spares any flight whose aircraft was already on stand when it was announced (standStart before c[2]).
const blockedBy = (fac, w, standStart) => (fac.shuts || []).find(c => w[0] < c[1] && c[0] < w[1] && (standStart === undefined ? w[0] : standStart) >= c[2]);

// Industry practice counts a departure within 15 minutes as on time, so the first 15 minutes of delay are free.
const delayCost = (f, delay) => Math.max(0, delay - RULES.grace) * (f.high ? RULES.delayHigh : RULES.delayNormal);

// The live shift.
function startRun(){

  result=null;render();requestAnimationFrame(tick);

function fire(e){

function resume(timedOut){if(!run||!run.paused)return;if(timedOut)run.log.push({t:run.c,s:'Decision time ran out. The shift carried on.',k:'warn'});run.paused=null;run.last=performance.now();render()}

  let changed=false;const e=evaluate(scenarioAt(sc,run.c),run.plan);

    run.frozen[f.id]={ok:r.ok,points:r.points,issues:r.issues.slice(),delay:r.delay,dep:r.dep};changed=true;
    run.log.push(r.ok?{t:r.dep,s:`${f.id} departed${r.delay?' '+r.delay+' min late':' on time'}.`}:{t:r.dep,s:`${f.id} cancelled: ${r.issues[0]}.`,k:'bad'});}

    delayMin:z.reduce((a,x)=>a+(x.ok?x.delay:0),0),bonus,log:run.log.concat([{t:Math.floor(run.c),s:'Shift complete.'}])};
